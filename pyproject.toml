[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "campus_chatbot"
version = "1.0.0"
description = "Campus navigation chatbot with multimodal support"
requires-python = ">=3.10"
dependencies = [
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "rapidfuzz==3.9.0",
    "groq>=0.30.0,<1.0.0",
    "langchain",
    "langchain-groq",
    "langchain-core",
    "langgraph",
    "torch",
    "transformers",
    "Pillow",
    "numpy",
    "faiss-cpu",
    "openai-whisper",
    "pandas",
    "matplotlib",
]

[project.scripts]
chatbot-text       = "campus_chatbot.entrypoints.text:main"
chatbot-audio      = "campus_chatbot.entrypoints.audio:main"
chatbot-image      = "campus_chatbot.entrypoints.image:main"
chatbot-multimodal = "campus_chatbot.entrypoints.multimodal:main"
chatbot-audio-text = "campus_chatbot.entrypoints.audio_with_text:main"