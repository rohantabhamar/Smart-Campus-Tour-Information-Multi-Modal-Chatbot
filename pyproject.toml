[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "campus_chatbot"
version = "1.0.0"
description = "Campus navigation chatbot with multimodal support"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
chatbot-text       = "campus_chatbot.entrypoints.text:main"
chatbot-audio      = "campus_chatbot.entrypoints.audio:main"
chatbot-image      = "campus_chatbot.entrypoints.image:main"
chatbot-multimodal = "campus_chatbot.entrypoints.multimodal:main"
chatbot-audio-text = "campus_chatbot.entrypoints.audio_with_text:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"